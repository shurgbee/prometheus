[project]
name = "prometheus-finance-hub"
version = "0.1.0"
description = "Prometheus FastAPI backend and durable worker"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "aiosqlite>=0.21,<1",
  "pydantic-settings>=2.8,<3", "python-multipart>=0.0.20,<1",
  "langgraph>=1.0,<2", "langgraph-checkpoint-postgres>=3,<4",
  "langgraph-checkpoint-sqlite>=3.0.1,<4", "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.4,<1", "exchange-calendars>=4.11,<5",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]
[project.scripts]
finance-worker = "finance_hub.worker:main"
finance-seed = "finance_hub.seed:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/finance_hub"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
